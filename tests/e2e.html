<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <title>AF e2e</title>
  <link rel="stylesheet" href="../css/styles.css?v=sopravvivenza1" />
</head>
<body>
  <pre id="e2e-out">running…</pre>
  <div id="app"></div>
  <script src="../js/content.js?v=sopravvivenza1"></script>
  <script src="../js/rng.js?v=sopravvivenza1"></script>
  <script src="../js/storage.js?v=sopravvivenza1"></script>
  <script src="../js/generator.js?v=sopravvivenza1"></script>
  <script src="../js/app.js?v=sopravvivenza1"></script>
  <script>
    (async function () {
      const out = document.getElementById("e2e-out");
      function click(act, id) {
        const sel = id ? `[data-act="${act}"][data-id="${id}"]` : `[data-act="${act}"]`;
        const btn = document.querySelector(sel);
        if (!btn) throw new Error("manca " + sel + " html=" + document.getElementById("app").innerText.slice(0, 220));
        btn.click();
      }
      function sleep(ms) {
        return new Promise((r) => setTimeout(r, ms));
      }
      function acts() {
        return [...document.querySelectorAll("[data-act]")].map((b) => b.getAttribute("data-act")).join(",");
      }
      try {
        AF_STORAGE.setActive(null);
        AF_STORAGE.resetUsed();
        AF_APP.startNew("", ["Luca", "Mia"]);
        if (!document.querySelector("[data-act='intro-next']")) throw new Error("no intro");
        if (!document.body.innerText.includes("Luca")) throw new Error("manca giocatore");
        if (document.body.innerText.toLowerCase().includes("vista master")) throw new Error("master view still there");
        if (/si rivede a cena|strega/i.test(document.body.innerText)) throw new Error("testo da fiaba");
        if (!/avanzamento\s*0\s*\/\s*5/i.test(document.body.innerText)) throw new Error("manca avanzamento 0/5");
        const titles = [
          "Giungla mortale",
          "La maledizione del faraone",
          "Sperduto nello spazio",
          "La montagna ghiacciata",
          "Naufragio",
          "Il deserto bianco"
        ];
        const g0 = AF_STORAGE.getActive();
        if (!titles.some((t) => document.body.innerText.includes(t) || (g0 && g0.title === t))) {
          throw new Error(
            "titolo non è una spedizione title=" +
              (g0 && g0.title) +
              " text=" +
              document.body.innerText.replace(/\s+/g, " ").slice(0, 280)
          );
        }
        click("intro-next");
        const choice = document.querySelector("[data-act='pick']");
        if (!choice) throw new Error("no choice acts=" + acts());
        choice.click();
        if (!document.querySelector("[data-act='do-spin']")) throw new Error("no compass acts=" + acts());
        AF_RNG.spinCompass = function (rand, current) {
          return AF_RNG.spinCompassToColor("green", current || 0, function () {
            return 0.5;
          });
        };
        AF_APP.state.forceColor = "green";
        click("do-spin");
        let found = false;
        for (let i = 0; i < 30; i++) {
          await sleep(200);
          if (document.querySelector("[data-act='scene-next']")) {
            found = true;
            break;
          }
        }
        if (!found) {
          throw new Error(
            "bussola non ha finito acts=" +
              acts() +
              " view=" +
              AF_APP.state.view +
              " phase=" +
              (AF_STORAGE.getActive() && AF_STORAGE.getActive().phase) +
              " spinning=" +
              AF_APP.state.spinning +
              " last=" +
              JSON.stringify(AF_APP.state.lastSpin)
          );
        }
        if (!/verde/i.test(document.body.innerText)) throw new Error("manca esito verde");
        if (!/avanzate/i.test(document.body.innerText)) throw new Error("manca differenza verde/avanzate");
        click("scene-next");
        const g = AF_STORAGE.getActive();
        if (!g || g.sceneIndex < 1) throw new Error("non è andata alla scena dopo");
        if (g.progress !== 1) throw new Error("verde deve avanzare, progress=" + g.progress);
        if (!document.querySelector("[data-act='pick']")) {
          throw new Error("niente scena dopo acts=" + acts());
        }
        if (!/avanzamento\s*1\s*\/\s*5/i.test(document.body.innerText)) throw new Error("hud non è 1/5 dopo il verde");
        const hpAfterGreen = AF_STORAGE.getActive().players.map((p) => p.hp);
        document.querySelector("[data-act='pick']").click();
        AF_APP.state.forceColor = "red";
        click("do-spin");
        found = false;
        for (let i = 0; i < 30; i++) {
          await sleep(200);
          if (document.querySelector("[data-act='scene-next']")) {
            found = true;
            break;
          }
        }
        if (!found) throw new Error("rosso: bussola non ha finito acts=" + acts());
        if (!/rosso/i.test(document.body.innerText)) throw new Error("manca esito rosso");
        if (!/non avanzate/i.test(document.body.innerText)) throw new Error("manca differenza rosso/non avanzate");
        const afterRed = AF_STORAGE.getActive();
        if (afterRed.progress !== 1) throw new Error("rosso non deve avanzare, progress=" + afterRed.progress);
        const hpAfterRed = afterRed.players.map((p) => p.hp);
        if (hpAfterRed.reduce((a, b) => a + b, 0) >= hpAfterGreen.reduce((a, b) => a + b, 0)) {
          throw new Error("rosso deve togliere una vita");
        }
        click("scene-next");
        const afterNext = AF_STORAGE.getActive();
        if (afterNext.status !== "ongoing") throw new Error("la storia non deve chiudersi");
        if (afterNext.progress !== 1) throw new Error("dopo il rosso progress deve restare 1");
        if (!document.querySelector("[data-act='pick']")) throw new Error("dopo il rosso deve esserci un'altra prova");
        if (document.body.innerText.includes("1 / 8") || /cattivo:/i.test(document.body.innerText)) {
          throw new Error("hud vecchio 8 scene / cattivo");
        }
        out.textContent = "E2E_OK " + (afterNext.title || "") + " p=" + afterNext.progress;
      } catch (err) {
        out.textContent = "E2E_FAIL " + err.message;
      }
    })();
  </script>
</body>
</html>
